[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qchem-eval"
version = "0.1.0"
description = "量子化学计算结果的质量判定：规则引擎 + 缺数据不等于通过"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
bench = ["cclib>=1.8"]
dev = ["pytest>=7.0"]

[project.scripts]
qchem-eval = "qchem_eval.cli:main"

[tool.setuptools.packages.find]
include = ["qchem_eval*"]

[tool.setuptools.package-data]
qchem_eval = ["rules/*.yaml"]
